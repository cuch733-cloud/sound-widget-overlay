name: Build exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller PyQt6 winsdk

      - name: Build exe
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path logo.ico) { $extra += "--icon", "logo.ico", "--add-data", "logo.ico;." }
          if (Test-Path logo.png) { $extra += "--add-data", "logo.png;." }
          python -m PyInstaller --noconfirm --clean --onefile --noconsole `
            --name "Sound.Widget.Overlay" --collect-all winsdk @extra sound_widget_overlay.py

      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\Sound.Widget.Overlay.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Sound.Widget.Overlay.exe" | Out-File -Encoding ascii dist\SHA256.txt
          Write-Host "SHA256: $h"
          "### SHA256`n``$h``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Sound.Widget.Overlay
          path: |
            dist/Sound.Widget.Overlay.exe
            dist/SHA256.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sound.Widget.Overlay.exe
            dist/SHA256.txt
